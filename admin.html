<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infographic Admin</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; color: #0f172a; }
    h1 { font-size: 1.3rem; }
    input[type="password"] { width: 100%; padding: .6rem; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: .75rem; padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #gate-error { color: #b91c1c; margin-top: .5rem; min-height: 1.2em; }
    #admin-app { display: none; }
  </style>
</head>
<body>
  <h1>Infographic Admin</h1>

  <div id="gate">
    <div id="gate-setup">
      <p>First time here — enter your GitHub token once, then choose a short PIN for future visits.</p>
      <label for="setup-token">GitHub Token</label>
      <input type="password" id="setup-token" autocomplete="off">
      <label for="setup-pin">Choose a PIN (min 4 characters)</label>
      <input type="password" id="setup-pin" autocomplete="off">
      <label for="setup-pin-confirm">Confirm PIN</label>
      <input type="password" id="setup-pin-confirm" autocomplete="off">
      <div id="setup-error" style="color:#b91c1c; margin-top:.5rem; min-height:1.2em;"></div>
      <button id="setup-save">Save</button>
    </div>

    <div id="gate-pin" style="display:none;">
      <label for="pin-input">Enter PIN</label>
      <input type="password" id="pin-input" autocomplete="off">
      <div id="pin-error" style="color:#b91c1c; margin-top:.5rem; min-height:1.2em;"></div>
      <button id="pin-unlock">Unlock</button>
      <p><a href="#" id="pin-forgot">Forgot PIN? Reset</a></p>
    </div>
  </div>

  <div id="admin-app">
    <p id="admin-status">Signed in as authorized admin.</p>
    <section>
      <h2>Upload New Infographic</h2>
      <input type="file" id="upload-file" accept="image/*">
      <div id="upload-preview"></div>
      <button id="upload-btn" disabled>Upload</button>
      <button id="retry-manifest-btn" style="display:none;">Retry list update</button>
      <p id="upload-progress"></p>
      <p id="upload-error" style="color:#b91c1c;"></p>
    </section>
    <section>
      <h2>Current Infographics</h2>
      <div id="current-list"></div>
    </section>
  </div>

  <script src="assets/admin/github-api.js"></script>
  <script src="assets/admin/crypto-vault.js"></script>
  <script>
    (function () {
      var VAULT_KEY = 'mwa_admin_vault';
      var currentToken = null;

      window.getAdminToken = function () {
        return currentToken;
      };

      var gate = document.getElementById('gate');
      var app = document.getElementById('admin-app');
      var setupView = document.getElementById('gate-setup');
      var pinView = document.getElementById('gate-pin');

      var setupTokenInput = document.getElementById('setup-token');
      var setupPinInput = document.getElementById('setup-pin');
      var setupPinConfirmInput = document.getElementById('setup-pin-confirm');
      var setupError = document.getElementById('setup-error');
      var setupSaveBtn = document.getElementById('setup-save');

      var pinInput = document.getElementById('pin-input');
      var pinError = document.getElementById('pin-error');
      var pinUnlockBtn = document.getElementById('pin-unlock');
      var pinForgotLink = document.getElementById('pin-forgot');

      function showApp() {
        gate.style.display = 'none';
        app.style.display = 'block';
        if (typeof window.refreshInfographicList === 'function') {
          window.refreshInfographicList();
        }
      }

      function showSetup() {
        setupView.style.display = 'block';
        pinView.style.display = 'none';
      }

      function showPinEntry() {
        setupView.style.display = 'none';
        pinView.style.display = 'block';
      }

      function getVault() {
        var raw = localStorage.getItem(VAULT_KEY);
        if (!raw) return null;
        try {
          return JSON.parse(raw);
        } catch (e) {
          return null;
        }
      }

      setupSaveBtn.addEventListener('click', function () {
        var token = setupTokenInput.value.trim();
        var pin = setupPinInput.value;
        var pinConfirm = setupPinConfirmInput.value;
        setupError.textContent = '';

        if (!token) {
          setupError.textContent = 'Enter your GitHub token.';
          return;
        }
        if (pin.length < 4) {
          setupError.textContent = 'PIN must be at least 4 characters.';
          return;
        }
        if (pin !== pinConfirm) {
          setupError.textContent = 'PIN and confirmation do not match.';
          return;
        }

        GitHubAPI.validateToken(token).then(function (ok) {
          if (!ok) {
            setupError.textContent = 'Invalid password / no access.';
            return;
          }
          return CryptoVault.encryptToken(token, pin).then(function (vault) {
            localStorage.setItem(VAULT_KEY, JSON.stringify(vault));
            currentToken = token;
            showApp();
          });
        }).catch(function () {
          setupError.textContent = 'Could not reach GitHub. Check your connection and try again.';
        });
      });

      pinUnlockBtn.addEventListener('click', function () {
        var pin = pinInput.value;
        pinError.textContent = '';
        var vault = getVault();
        if (!vault) {
          showSetup();
          return;
        }

        CryptoVault.decryptToken(vault, pin).then(function (token) {
          return GitHubAPI.validateToken(token).then(function (ok) {
            if (!ok) {
              pinError.textContent = 'Your saved token is no longer valid. Reset and enter a new one.';
              return;
            }
            currentToken = token;
            showApp();
          });
        }).catch(function () {
          pinError.textContent = 'Incorrect PIN.';
        });
      });

      pinForgotLink.addEventListener('click', function (e) {
        e.preventDefault();
        if (!window.confirm('Reset saved admin access? You will need to re-enter your GitHub token.')) return;
        localStorage.removeItem(VAULT_KEY);
        pinInput.value = '';
        pinError.textContent = '';
        showSetup();
      });

      var existingVault = getVault();
      if (existingVault) {
        showPinEntry();
      } else {
        showSetup();
      }
    })();
  </script>
  <script src="assets/admin/manifest-utils.js"></script>
  <script src="assets/admin/image-compress.js"></script>
  <script>
    (function () {
      var MANIFEST_PATH = 'assets/images/infographics.json';
      var IMAGES_DIR = 'assets/images/';

      var fileInput = document.getElementById('upload-file');
      var previewEl = document.getElementById('upload-preview');
      var uploadBtn = document.getElementById('upload-btn');
      var retryBtn = document.getElementById('retry-manifest-btn');
      var progressEl = document.getElementById('upload-progress');
      var errorEl = document.getElementById('upload-error');

      var pendingBlob = null;
      var lastFailedUpload = null;

      function getToken() {
        return window.getAdminToken();
      }

      function updateManifestWithEntry(imagePath, filename) {
        var token = getToken();
        progressEl.textContent = 'Updating carousel list...';
        errorEl.textContent = '';
        retryBtn.style.display = 'none';

        return GitHubAPI.getFile(MANIFEST_PATH, token).then(function (manifestFile) {
          var manifest = manifestFile ? JSON.parse(atob(manifestFile.content)) : [];
          var alreadyListed = manifest.some(function (m) { return m.file === imagePath; });
          var updatedManifest = alreadyListed ? manifest : ManifestUtils.addEntry(manifest, { file: imagePath, alt: 'Infographic' });
          return GitHubAPI.putFile(
            MANIFEST_PATH,
            btoa(JSON.stringify(updatedManifest, null, 2)),
            'Add ' + filename + ' to infographics list',
            token,
            manifestFile ? manifestFile.sha : undefined
          );
        }).then(function () {
          progressEl.textContent = 'Done, live in ~1 minute.';
          lastFailedUpload = null;
          fileInput.value = '';
          previewEl.innerHTML = '';
          pendingBlob = null;
          if (typeof window.refreshInfographicList === 'function') {
            window.refreshInfographicList();
          }
        }).catch(function (err) {
          progressEl.textContent = '';
          lastFailedUpload = { imagePath: imagePath, filename: filename };
          errorEl.textContent = 'Image uploaded as ' + imagePath +
            ' but the carousel list failed to update: ' + err.message + '.';
          retryBtn.style.display = 'inline-block';
        });
      }

      fileInput.addEventListener('change', function () {
        var file = fileInput.files[0];
        errorEl.textContent = '';
        uploadBtn.disabled = true;
        pendingBlob = null;
        if (!file) return;

        progressEl.textContent = 'Compressing...';
        ImageCompress.compressImage(file, 1600, 0.82).then(function (blob) {
          pendingBlob = blob;
          previewEl.innerHTML = '';
          var img = document.createElement('img');
          img.style.maxWidth = '240px';
          img.src = URL.createObjectURL(blob);
          previewEl.appendChild(img);
          uploadBtn.disabled = false;
          progressEl.textContent = 'Ready to upload.';
        }).catch(function (err) {
          errorEl.textContent = err.message;
          progressEl.textContent = '';
        });
      });

      uploadBtn.addEventListener('click', function () {
        if (!pendingBlob) return;
        var token = getToken();
        uploadBtn.disabled = true;
        errorEl.textContent = '';
        retryBtn.style.display = 'none';

        GitHubAPI.getFile(MANIFEST_PATH, token).then(function (manifestFile) {
          var manifest = manifestFile ? JSON.parse(atob(manifestFile.content)) : [];
          var filename = ManifestUtils.generateFilename(new Date(), manifest.map(function (m) { return m.file; }));
          var imagePath = IMAGES_DIR + filename;

          progressEl.textContent = 'Uploading image...';
          return ImageCompress.blobToBase64(pendingBlob).then(function (base64) {
            return GitHubAPI.putFile(imagePath, base64, 'Add infographic ' + filename, token);
          }).then(function () {
            return updateManifestWithEntry(imagePath, filename);
          });
        }).catch(function (err) {
          progressEl.textContent = '';
          errorEl.textContent = err.message;
        }).then(function () {
          uploadBtn.disabled = false;
        });
      });

      retryBtn.addEventListener('click', function () {
        if (!lastFailedUpload) return;
        updateManifestWithEntry(lastFailedUpload.imagePath, lastFailedUpload.filename);
      });
    })();
  </script>
  <script>
    (function () {
      var MANIFEST_PATH = 'assets/images/infographics.json';
      var listEl = document.getElementById('current-list');

      function getToken() {
        return window.getAdminToken();
      }

      function renderList(manifest) {
        listEl.innerHTML = '';
        manifest.forEach(function (entry) {
          var item = document.createElement('div');
          item.style.display = 'inline-block';
          item.style.margin = '0 12px 12px 0';
          item.style.textAlign = 'center';

          var img = document.createElement('img');
          img.src = entry.file;
          img.style.width = '120px';
          img.style.display = 'block';

          var delBtn = document.createElement('button');
          delBtn.textContent = 'Delete';
          delBtn.addEventListener('click', function () {
            if (!window.confirm('Delete this infographic?')) return;
            deleteEntry(entry.file);
          });

          item.appendChild(img);
          item.appendChild(delBtn);
          listEl.appendChild(item);
        });
      }

      function loadList() {
        var token = getToken();
        GitHubAPI.getFile(MANIFEST_PATH, token).then(function (manifestFile) {
          var manifest = manifestFile ? JSON.parse(atob(manifestFile.content)) : [];
          renderList(manifest);
        });
      }

      function deleteEntry(file) {
        var token = getToken();
        GitHubAPI.getFile(MANIFEST_PATH, token).then(function (manifestFile) {
          var manifest = manifestFile ? JSON.parse(atob(manifestFile.content)) : [];
          var updatedManifest = ManifestUtils.removeEntry(manifest, file);
          return GitHubAPI.putFile(
            MANIFEST_PATH,
            btoa(JSON.stringify(updatedManifest, null, 2)),
            'Remove ' + file + ' from infographics list',
            token,
            manifestFile.sha
          ).then(function () {
            return GitHubAPI.getFile(file, token);
          }).then(function (imageFile) {
            if (imageFile) {
              return GitHubAPI.deleteFile(file, imageFile.sha, 'Delete infographic ' + file, token);
            }
          });
        }).then(function () {
          loadList();
        }).catch(function (err) {
          window.alert('Delete failed: ' + err.message);
          loadList();
        });
      }

      window.refreshInfographicList = loadList;
    })();
  </script>
</body>
</html>
